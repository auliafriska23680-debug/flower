
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Pertamaku</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            color: #222;
            text-align: center;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 25px;
        }

        nav {
            background: #1e40af;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .container {
            padding: 60px 20px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        footer {
            background: #222;
            color: white;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Selamat Datang!</h1>
        <p>Website HTML Pertamaku</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#tentang">Tentang</a>
        <a href="#kontak">Kontak</a>
    </nav>

    <div class="container" id="home">
        <h2>Halo, Dunia!</h2>
        <p>Ini adalah contoh website sederhana menggunakan HTML dan CSS.</p>

        <button onclick="sapa()">Klik Saya</button>

        <h3 id="pesan"></h3>
    </div>

    <div class="container" id="tentang">
        <h2>Tentang Kami</h2>
        <p>Kami sedang belajar membuat website dengan HTML.</p>
    </div>

    <div class="container" id="kontak">
        <h2>Kontak</h2>
        <p>Email: contoh@email.com</p>
    </div>

    <footer>
        <p>&copy; 2026 Website Pertamaku</p>
    </footer>

    <script>
        function sapa() {
            document.getElementById("pesan").innerHTML =
                "Halo! Selamat belajar HTML 🚀";
        }
    </script>

</body>
</html>
